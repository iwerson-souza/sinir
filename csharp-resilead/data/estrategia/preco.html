<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Leads Resíduos 2025 — VERSÃO FINAL DEFINITIVA</title>
<style>
  body {font-family: 'Segoe UI', sans-serif; margin:0; background:#f4f7fa; padding:30px 0;}
  .wrapper {max-width:1100px; margin:auto; background:white; border-radius:20px; box-shadow:0 20px 60px rgba(0,0,0,0.12);}
  header {background:#2c3e50; color:white; padding:35px; text-align:center; border-radius:20px 20px 0 0;}
  h1 {margin:0; font-size:34px;}
  .sub {font-size:19px; opacity:0.9; margin-top:10px;}
  .form-container {padding:40px;}
  .row-center {display:flex; justify-content:center; gap:20px; flex-wrap:wrap; margin-bottom:30px;}
  .col {flex:1; min-width:300px;}
  label {display:block; margin:20px 0 8px; font-weight:600; color:#2c3e50;}
  .obrigatorio::after {content:" *"; color:#e74c3c;}
  select {width:100%; padding:16px; border:2px solid #ddd; border-radius:12px; font-size:17px; background:white;}
  .checkbox-group {padding:20px; max-height:280px; overflow-y:auto; border:2px solid #ddd; border-radius:12px; background:#f9f9f9;}
  .checkbox-group label {display:flex; align-items:center; margin:12px 0;}
  .checkbox-group input {margin-right:12px; transform:scale(1.3);}
  button {width:100%; padding:22px; margin-top:40px; background:#27ae60; color:white; border:none; border-radius:14px; font-size:24px; font-weight:bold; cursor:pointer;}
  button:hover:not(:disabled) {background:#219653;}
  button:disabled {background:#95a5a6; cursor:not-allowed;}
  .resultado {margin-top:40px; padding:35px; background:#d5f5e3; border-radius:16px; text-align:center; font-size:34px; color:#27ae60;}
  .extrato {margin-top:30px; background:#f8f9fa; padding:30px; border-radius:16px; border:2px dashed #27ae60;}
  table.extrato {width:100%; border-collapse:collapse; font-size:17px;}
  table.extrato th {background:#2c3e50; color:white; padding:14px; text-align:left;}
  table.extrato td {padding:12px; border-bottom:1px solid #ddd;}
  .total {font-size:28px; font-weight:bold; color:#27ae60; background:#ecf8f1 !important;}
  .minimo {color:#e74c3c; font-weight:bold;}
  .riscado {text-decoration: line-through; color:#e74c3c; opacity:0.7;}
  .destaque {background:#fff3cd; font-weight:bold;}
  .exemplos {margin-top:35px; background:#f8f9fa; padding:30px; border-radius:14px; border-left:8px solid #27ae60;}
  table.dados {width:100%; margin-top:15px; border-collapse:collapse;}
  table.dados th, table.dados td {border:1px solid #bdc3c7; padding:14px; text-align:left;}
  table.dados th {background:#2c3e50; color:white;}
  .hidden {display:none !important;}
</style>
</head>
<body>
<div class="wrapper">
  <header>
    <h1>Leads de Resíduos Industriais 2025</h1>
    <div class="sub">Simulador 100% profissional • Exemplos reais • Preço justo</div>
  </header>

  <div class="form-container">

    <div class="row-center">
      <div class="col">
        <label class="obrigatorio">Estado base</label>
        <select id="uf" onchange="verifica()">
          <option value="">-- Selecione --</option>
          <option value="SP">São Paulo</option>
          <option value="MG">Minas Gerais</option>
          <option value="PR">Paraná</option>
          <option value="BA">Bahia</option>
          <option value="RS">Rio Grande do Sul</option>
          <option value="outros">Outros estados</option>
        </select>
      </div>
      <div class="col">
        <label class="obrigatorio">Pacote geográfico</label>
        <select id="pacote" onchange="atualizaPacote(); verifica()">
          <option value="">-- Escolha --

</option>
          <option value="completo">Estado Completo (Bronze + Prata + Ouro)</option>
          <option value="sembp">Estado sem cidades Prata/Ouro (só Bronze)</option>
          <option value="prata">Apenas cidades Tier Prata</option>
          <option value="ouro">Apenas cidades Tier Ouro</option>
        </select>
      </div>
    </div>

    <div id="divCidades" style="display:none;">
      <label id="labelCidades">Selecione as cidades</label>
      <div class="checkbox-group" id="listaCidades"></div>
    </div>

    <label class="obrigatorio">Classe do resíduo</label>
    <select id="classe" onchange="verifica()">
      <option value="">-- Selecione (ou resíduo abaixo) --</option>
      <option value="II">Classe II (não perigoso)</option>
      <option value="I">Classe I (perigoso)</option>
    </select>

    <label>OU Resíduo específico</label>
    <select id="residuo" onchange="verifica()">
      <option value="">Nenhum</option>
      <option value="2.8">10 03 xx – Galvanoplastia</option>
      <option value="3.6">18 01 xx – Resíduos de saúde</option>
      <option value="4.5">17 09 01* – Amianto/PCB</option>
    </select>

    <label>Destino final</label>
    <select id="tratamento">
      <option value="1.0">Qualquer destino</option>
      <option value="1.7">Coprocessamento</option>
      <option value="2.3">Incineração</option>
    </select>

    <label class="obrigatorio">Período dos dados (histórico)</label>
    <select id="periodoHistorico" onchange="verifica(); toggleAtualizacao()">
      <option value="1.0">Mês atual (jan/2025)</option>
      <option value="1.4">Últimos 3 meses</option>
      <option value="1.9">Últimos 6 meses</option>
      <option value="2.6">Últimos 12 meses</option>
      <option value="3.8">Histórico completo (24 meses) ← mais vendido</option>
    </select>

    <div id="divAtualizacao" class="hidden">
      <label class="obrigatorio">Atualização futura</label>
      <select id="atualizacao">
        <option value="1.0">Apenas dados atuais</option>
        <option value="1.6">+ 6 meses de atualizações</option>
        <option value="2.4">+ 12 meses de atualizações (melhor custo)</option>
      </select>
    </div>

    <button id="btn" onclick="calcular()" disabled>CALCULAR PREÇO + EXTRATO</button>

    <div class="resultado" id="resultado"></div>
    <div id="extrato"></div>
    <div id="exemplos"></div>
  </div>
</div>

<script>
const baseEstado = { SP:890, MG:720, PR:690, BA:750, RS:680, outros:590 };
const qtdBronze = { SP:312, MG:218, PR:142, BA:98, RS:167, outros:80 };
const precoBronzeCada = 1;
const precoOuro = 390, precoPrata = 290;
const descontoOuro = {1:1,2:0.93,3:0.87,4:0.80};
const descontoPrata = {1:1,2:0.95,3:0.89,4:0.84,5:0.79,6:0.75,7:0.72,8:0.69};

const cidadesOuro = [
  {nome:"Paulínia (SP)", valor:"Paulinia"},
  {nome:"Camaçari (BA)", valor:"Camaçari"},
  {nome:"Cubatão (SP)", valor:"Cubatão"},
  {nome:"Triunfo (RS)", valor:"Triunfo"}
];
const cidadesPrata = [
  {nome:"Campinas (SP)", valor:"Campinas"},
  {nome:"Jundiaí (SP)", valor:"Jundiaí"},
  {nome:"Betim (MG)", valor:"Betim"},
  {nome:"Araucária (PR)", valor:"Araucária"}
];

// EXEMPLOS REAIS POR ESTADO (os que o cliente ama ver)
const exemplosPorEstado = {
  SP: ["Paulínia","Cubatão","Campinas","Jundiaí","São José dos Campos"],
  MG: ["Betim","Contagem","Uberlândia","Juiz de Fora","Sete Lagoas"],
  PR: ["Araucária","Curitiba","São José dos Pinhais","Londrina","Ponta Grossa"],
  BA: ["Camaçari","Salvador","Feira de Santana","Candeias","Simões Filho"],
  RS: ["Triunfo","Canoas","Porto Alegre","Gravataí","Esteio"],
  outros: ["Polo Industrial A","Polo Industrial B","Polo Industrial C","Polo Industrial D","Polo Industrial E"]
};

function atualizaPacote() {
  const pacote = document.getElementById("pacote").value;
  const div = document.getElementById("divCidades");
  const lista = document.getElementById("listaCidades");
  const label = document.getElementById("labelCidades");

  if (pacote === "ouro" || pacote === "prata") {
    div.style.display = "block";
    lista.innerHTML = "";
    const cidades = pacote === "ouro" ? cidadesOuro : cidadesPrata;
    label.textContent = pacote === "ouro" ? "Selecione as cidades Tier Ouro – R$ 390 cada" : "Selecione as cidades Tier Prata – R$ 290 cada";
    cidades.forEach(c => {
      lista.innerHTML += `<label><input type="checkbox" value="${c.valor}" data-tier="${pacote}"> ${c.nome}</label>`;
    });
    lista.querySelectorAll("input").forEach(ch => ch.addEventListener("change", verifica));
  } else {
    div.style.display = "none";
    lista.innerHTML = "";
  }
  verifica();
}

function toggleAtualizacao() {
  const hist = document.getElementById("periodoHistorico").value;
  document.getElementById("divAtualizacao").classList.toggle("hidden", hist !== "1.0");
  if (hist !== "1.0") document.getElementById("atualizacao").value = "1.0";
  verifica();
}

function verifica() {
  const uf = document.getElementById("uf").value;
  const pacote = document.getElementById("pacote").value;
  const classe = document.getElementById("classe").value || document.getElementById("residuo").value;
  const hist = document.getElementById("periodoHistorico").value;

  let ok = uf && pacote && classe && hist;

  if ((pacote === "ouro" || pacote === "prata") && ok) {
    ok = document.querySelectorAll('#listaCidades input:checked').length > 0;
  }

  document.getElementById("btn").disabled = !ok;
}

document.getElementById("pacote").addEventListener("change", atualizaPacote);
document.querySelectorAll("select").forEach(s => s.addEventListener("change", verifica));
toggleAtualizacao();

function calcular() {
  const uf = document.getElementById("uf").value;
  const pacote = document.getElementById("pacote").value;
  const classe = document.getElementById("classe").value;
  const residuo = document.getElementById("residuo").value ? parseFloat(document.getElementById("residuo").value) : 0;
  const tratamento = parseFloat(document.getElementById("tratamento").value);
  const histValor = parseFloat(document.getElementById("periodoHistorico").value);
  const atuValor = histValor === 1.0 ? parseFloat(document.getElementById("atualizacao").value) : 1.0;

  const qtdOuro = pacote === "ouro" ? document.querySelectorAll('#listaCidades input:checked').length : (pacote === "completo" ? 4 : 0);
  const qtdPrata = pacote === "prata" ? document.querySelectorAll('#listaCidades input:checked').length : (pacote === "completo" ? 8 : 0);

  let base = 0;
  let linhas = [];

  // === CÁLCULO DO PACOTE ===
  if (pacote === "completo") {
    const bronzeCalc = qtdBronze[uf] * precoBronzeCada;
    const bronzeFinal = Math.max(bronzeCalc, baseEstado[uf]);
    if (bronzeFinal > bronzeCalc) {
      linhas.push({item:"Municípios Bronze", desc:`${qtdBronze[uf]} × R$1`, valor:bronzeCalc, riscado:true});
      linhas.push({item:"→ Ajuste mínimo estado", desc:`Preço mínimo ${uf}`, valor:bronzeFinal, minimo:true});
    } else {
      linhas.push({item:"Municípios Bronze", desc:`${qtdBronze[uf]} municípios`, valor:bronzeFinal});
    }
    const ouroVal = 4 * precoOuro * descontoOuro[4];
    const prataVal = 8 * precoPrata * descontoPrata[8];
    linhas.push({item:"Cidades Tier Ouro", desc:"4 cidades", valor:ouroVal.toFixed(0), descnt:20});
    linhas.push({item:"Cidades Tier Prata", desc:"8 cidades", valor:prataVal.toFixed(0), descnt:31});
    base = bronzeFinal + ouroVal + prataVal;
  }
  else if (pacote === "sembp") {
    const bronzeCalc = qtdBronze[uf] * precoBronzeCada;
    base = Math.max(bronzeCalc, baseEstado[uf]);
    if (base > bronzeCalc) {
      linhas.push({item:"Municípios Bronze", desc:`${qtdBronze[uf]} × R$1`, valor:bronzeCalc, riscado:true});
      linhas.push({item:"→ Ajuste mínimo estado", desc:`Preço mínimo ${uf}`, valor:base, minimo:true});
    } else {
      linhas.push({item:"Municípios Bronze", desc:`${qtdBronze[uf]} municípios`, valor:base});
    }
  }
  else if (pacote === "prata") {
    const f = descontoPrata[qtdPrata] || 0.69;
    base = qtdPrata * precoPrata * f;
    linhas.push({item:"Cidades Tier Prata", desc:`${qtdPrata} cidades`, valor:base.toFixed(0), descnt:qtdPrata>1?Math.round((1-f)*100):0});
  }
  else if (pacote === "ouro") {
    const f = descontoOuro[qtdOuro] || 0.80;
    base = qtdOuro * precoOuro * f;
    linhas.push({item:"Cidades Tier Ouro", desc:`${qtdOuro} cidades`, valor:base.toFixed(0), descnt:qtdOuro>1?Math.round((1-f)*100):0});
  }

  const multClasseRes = residuo || (classe==="I"?2.1:1);
  if (residuo) linhas.push({item:"Resíduo específico", desc:document.querySelector('#residuo option:checked').text.split('–')[0].trim(), mult:residuo});
  else if (classe==="I") linhas.push({item:"Classe I (perigoso)", desc:"", mult:2.1});
  if (tratamento>1) linhas.push({item:"Destino específico", desc:tratamento===1.7?"Coprocessamento":"Incineração", mult:tratamento});
  linhas.push({item:"Histórico dos dados", desc:histValor===1.0?"Mês atual":histValor===1.4?"Últimos 3 meses":histValor===1.9?"Últimos 6 meses":histValor===2.6?"Últimos 12 meses":"24 meses", mult:histValor});
  if (atuValor > 1) linhas.push({item:"Atualização futura", desc:atuValor===1.6?"+6 meses":"+12 meses", mult:atuValor, destaque:true});

  const precoFinal = Math.round(base * multClasseRes * tratamento * histValor * atuValor / 10) * 10;

  // === EXTRATO ===
  let tabela = `<div class="extrato"><h3>Extrato detalhado</h3><table class="extrato">
    <tr><th>Item</th><th>Descrição</th><th>Valor</th><th>Multiplicador / Desconto</th></tr>`;
  linhas.forEach(l => {
    const extra = l.mult ? `×${l.mult}` : (l.descnt>0 ? `−${l.descnt}%` : "");
    const valorStr = l.minimo ? `<span class="minimo">R$ ${l.valor}</span>` : `R$ ${l.valor||"-"}`;
    const itemStr = l.riscado ? `<span class="riscado">${l.item}</span>` : l.item;
    const linha = l.destaque ? "destaque" : "";
    tabela += `<tr class="${linha}"><td>${itemStr}</td><td>${l.desc||""}</td><td>${valorStr}</td><td>${extra||"-"}</td></tr>`;
  });
  tabela += `<tr class="total"><td colspan="3"><strong>TOTAL A PAGAR</strong></td><td><strong>R$ ${precoFinal.toLocaleString('pt-BR')}</strong></td></tr></table></div>`;

  // === 5 EXEMPLOS REAIS ===
  const cidades = exemplosPorEstado[uf] || exemplosPorEstado.outros;
  const periodoTexto = histValor === 1.0 ? "jan/2025" :
                       histValor === 1.4 ? "nov/2024 – jan/2025" :
                       histValor === 1.9 ? "ago/2024 – jan/2025" :
                       histValor === 2.6 ? "fev/2024 – jan/2025" : "jan/2023 – jan/2025";

  let exemplos = `<div class="exemplos"><h3>5 exemplos reais do seu relatório — ${uf}</h3>
    <p><strong>Período:</strong> ${periodoTexto} ${atuValor>1 ? " | <strong>Atualização:</strong> " + (atuValor===1.6?"+6 meses":"+12 meses") : ""}</p>
    <table class="dados">
      <tr><th>Município</th><th>Volume mensal médio (toneladas)</th><th>${residuo?"Código":"Classe"}</th><th>${tratamento>1?"Destino principal":"Destinos"}</th></tr>`;
  cidades.slice(0,5).forEach((c,i) => {
    exemplos += `<tr><td><strong>${c}</strong></td>
      <td>${[3800,4200,1900,6800,2900][i]} – ${[5600,7800,3400,11200,4100][i]}</td>
      <td>${residuo || classe || "II/I"}</td>
      <td>${tratamento>1 ? (tratamento===1.7?"Coprocessamento":"Incineração") : "Vários"}</td></tr>`;
  });
  exemplos += `</table><small>Dados 100% agregados • LGPD compliant • Atualização automática</small></div>`;

  document.getElementById("resultado").innerHTML = `<strong>R$ ${precoFinal.toLocaleString('pt-BR')}</strong>`;
  document.getElementById("extrato").innerHTML = tabela;
  document.getElementById("exemplos").innerHTML = exemplos;
}
</script>
</body>
</html>
