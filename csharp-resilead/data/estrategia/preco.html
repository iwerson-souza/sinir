<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Leads Resíduos 2025 — VERSÃO FINAL REALISTA</title>
<style>
  body {font-family: 'Segoe UI', sans-serif; margin:0; background:#f4f7fa; padding:30px 0;}
  .wrapper {max-width:1100px; margin:auto; background:white; border-radius:20px; box-shadow:0 20px 60px rgba(0,0,0,0.12);}
  header {background:#2c3e50; color:white; padding:35px; text-align:center; border-radius:20px 20px 0 0;}
  h1 {margin:0; font-size:34px;}
  .sub {font-size:19px; opacity:0.9; margin-top:10px;}
  .form-container {padding:40px;}
  .row-center {display:flex; justify-content:center; gap:20px; flex-wrap:wrap; margin-bottom:30px;}
  .col {flex:1; min-width:300px;}
  label {display:block; margin:20px 0 8px; font-weight:600; color:#2c3e50;}
  .obrigatorio::after {content:" *"; color:#e74c3c;}
  select {width:100%; padding:16px; border:2px solid #ddd; border-radius:12px; font-size:17px; background:white;}
  .checkbox-group {padding:20px; max-height:280px; overflow-y:auto; border:2px solid #ddd; border-radius:12px; background:#f9f9f9;}
  .checkbox-group label {display:flex; align-items:center; margin:12px 0;}
  .checkbox-group input {margin-right:12px; transform:scale(1.3);}
  button {width:100%; padding:22px; margin-top:40px; background:#27ae60; color:white; border:none; border-radius:14px; font-size:24px; font-weight:bold; cursor:pointer;}
  button:hover:not(:disabled) {background:#219653;}
  button:disabled {background:#95a5a6; cursor:not-allowed;}
  .resultado {margin-top:40px; padding:35px; background:#d5f5e3; border-radius:16px; text-align:center; font-size:34px; color:#27ae60;}
  .extrato {margin-top:30px; background:#f8f9fa; padding:30px; border-radius:16px; border:2px dashed #27ae60;}
  table.extrato {width:100%; border-collapse:collapse; font-size:17px;}
  table.extrato th {background:#2c3e50; color:white; padding:14px; text-align:left;}
  table.extrato td {padding:12px; border-bottom:1px solid #ddd;}
  .total {font-size:28px; font-weight:bold; color:#27ae60; background:#ecf8f1 !important;}
  .minimo {color:#e67e22; font-weight:bold;}
  .exemplos {margin-top:35px; background:#f8f9fa; padding:30px; border-radius:14px; border-left:8px solid #27ae60;}
  table.dados {width:100%; margin-top:15px; border-collapse:collapse;}
  table.dados th, table.dados td {border:1px solid #bdc3c7; padding:14px; text-align:left;}
  table.dados th {background:#2c3e50; color:white;}
</style>
</head>
<body>
<div class="wrapper">
  <header>
    <h1>Leads de Resíduos Industriais 2025</h1>
    <div class="sub">Dados 100% reais • Exemplos dinâmicos por estado • Preço justo</div>
  </header>

  <div class="form-container">

    <div class="row-center">
      <div class="col">
        <label class="obrigatorio">Estado base</label>
        <select id="uf" onchange="verifica()">
          <option value="">-- Selecione --</option>
          <option value="SP">São Paulo</option>
          <option value="MG">Minas Gerais</option>
          <option value="PR">Paraná</option>
          <option value="BA">Bahia</option>
          <option value="RS">Rio Grande do Sul</option>
          <option value="outros">Outros estados</option>
        </select>
      </div>
      <div class="col">
        <label class="obrigatorio">Pacote geográfico</label>
        <select id="pacote" onchange="atualizaPacote(); verifica()">
          <option value="">-- Escolha o pacote --</option>
          <option value="completo">Estado Completo</option>
          <option value="sembp">Estado sem cidades Prata/Ouro (só Bronze)</option>
          <option value="prata">Apenas cidades Tier Prata</option>
          <option value="ouro">Apenas cidades Tier Ouro</option>
        </select>
      </div>
    </div>

    <div id="divCidades" style="display:none;">
      <label>Selecione as cidades Tier Prata ou Ouro</label>
      <div class="checkbox-group">
        <strong>Tier Ouro – R$ 390 cada</strong><br>
        <label><input type="checkbox" value="Paulinia" data-tier="ouro"> Paulínia (SP)</label>
        <label><input type="checkbox" value="Camaçari" data-tier="ouro"> Camaçari (BA)</label>
        <label><input type="checkbox" value="Cubatão" data-tier="ouro"> Cubatão (SP)</label>
        <label><input type="checkbox" value="Triunfo" data-tier="ouro"> Triunfo (RS)</label>

        <strong style="margin-top:18px;display:block;">Tier Prata – R$ 290 cada</strong>
        <label><input type="checkbox" value="Campinas" data-tier="prata"> Campinas (SP)</label>
        <label><input type="checkbox" value="Jundiaí" data-tier="prata"> Jundiaí (SP)</label>
        <label><input type="checkbox" value="Betim" data-tier="prata"> Betim (MG)</label>
        <label><input type="checkbox" value="Araucária" data-tier="prata"> Araucária (PR)</label>
      </div>
    </div>

    <label class="obrigatorio">Classe do resíduo</label>
    <select id="classe" onchange="verifica()">
      <option value="">-- Selecione (ou resíduo abaixo) --</option>
      <option value="II">Classe II (não perigoso)</option>
      <option value="I">Classe I (perigoso)</option>
    </select>

    <label>OU Resíduo específico</label>
    <select id="residuo" onchange="verifica()">
      <option value="">Nenhum</option>
      <option value="2.8">10 03 xx – Galvanoplastia</option>
      <option value="3.6">18 01 xx – Resíduos de saúde</option>
      <option value="4.5">17 09 01* – Amianto/PCB</option>
    </select>

    <label>Destino final</label>
    <select id="tratamento">
      <option value="1.0">Qualquer destino</option>
      <option value="1.7">Coprocessamento</option>
      <option value="2.3">Incineração</option>
    </select>

    <label class="obrigatorio">Atualização</label>
    <select id="periodo" onchange="verifica()">
      <option value="1.0">Dados atuais</option>
      <option value="1.5">+ 6 meses</option>
      <option value="2.1">+ 12 meses</option>
    </select>

    <button id="btn" onclick="calcular()" disabled>CALCULAR PREÇO + EXTRATO</button>

    <div class="resultado" id="resultado"></div>
    <div id="extrato"></div>
    <div id="exemplos"></div>
  </div>
</div>

<script>
// === DADOS REALISTAS POR ESTADO ===
const dadosExemplos = {
  SP: [
    {cidade:"Paulinia", ouro:true, volume:[38, 52], residuo:"10 03 xx", destino:"Incineração"},
    {cidade:"Campinas", prata:true, volume:[14, 21], residuo:"Classe I", destino:"Coprocessamento"},
    {cidade:"Cubatão", ouro:true, volume:[22, 31], residuo:"17 09 01*", destino:"Incineração"},
    {cidade:"Jundiaí", prata:true, volume:[9, 14], residuo:"Classe II", destino:"Reciclagem"},
    {cidade:"São José dos Campos", prata:true, volume:[7, 11], residuo:"18 01 xx", destino:"Coprocessamento"}
  ],
  PR: [
    {cidade:"Araucária", prata:true, volume:[18, 28], residuo:"13 07 01*", destino:"Coprocessamento"},
    {cidade:"Curitiba", volume:[6, 10], residuo:"Classe II", destino:"Vários"},
    {cidade:"São José dos Pinhais", volume:[5, 8], residuo:"Classe I", destino:"Coprocessamento"}
  ],
  MG: [
    {cidade:"Betim", prata:true, volume:[21, 33], residuo:"Classe I", destino:"Coprocessamento"},
    {cidade:"Contagem", volume:[8, 13], residuo:"10 03 xx", destino:"Incineração"}
  ],
  BA: [
    {cidade:"Camaçari", ouro:true, volume:[68, 98], residuo:"17 09 01*", destino:"Incineração"},
    {cidade:"Salvador", volume:[11, 18], residuo:"Classe II", destino:"Vários"}
  ],
  RS: [
    {cidade:"Triunfo", ouro:true, volume:[29, 41], residuo:"18 01 xx", destino:"Coprocessamento"},
    {cidade:"Canoas", volume:[7, 12], residuo:"Classe I", destino:"Coprocessamento"}
  ],
  outros: [
    {cidade:"Polo industrial genérico", volume:[5, 15], residuo:"Classe II", destino:"Vários"}
  ]
};

const baseEstado = { SP:890, MG:720, PR:690, BA:750, RS:680, outros:590 };
const qtdBronze = { SP:312, MG:218, PR:142, BA:98, RS:167, outros:80 };
const precoBronzeCada = 1;
const precoOuro = 390, precoPrata = 290;
const descontoOuro = {1:1,2:0.93,3:0.87,4:0.80};
const descontoPrata = {1:1,2:0.95,3:0.89,4:0.84,5:0.79,6:0.75,7:0.72,8:0.69};

function atualizaPacote() {
  const p = document.getElementById("pacote").value;
  document.getElementById("divCidades").style.display = (p==="prata"||p==="ouro") ? "block" : "none";
  if (p!=="prata" && p!=="ouro") document.querySelectorAll("#divCidades input").forEach(c=>c.checked=false);
  verifica();
}

function verifica() {
  const uf = document.getElementById("uf").value;
  const pacote = document.getElementById("pacote").value;
  const classe = document.getElementById("classe").value;
  const residuo = document.getElementById("residuo").value;
  const periodo = document.getElementById("periodo").value;
  document.getElementById("btn").disabled = !(uf && pacote && (classe||residuo) && periodo);
}

document.querySelectorAll("select, input").forEach(el => el.addEventListener("change", verifica));

function calcular() {
  const uf = document.getElementById("uf").value;
  const pacote = document.getElementById("pacote").value;
  const classe = document.getElementById("classe").value;
  const residuo = document.getElementById("residuo").value ? parseFloat(document.getElementById("residuo").value) : 0;
  const tratamento = parseFloat(document.getElementById("tratamento").value);
  const periodo = parseFloat(document.getElementById("periodo").value);

  const qtdOuro = document.querySelectorAll('#divCidades input[data-tier="ouro"]:checked').length;
  const qtdPrata = document.querySelectorAll('#divCidades input[data-tier="prata"]:checked').length;

  let base = 0;
  let linhas = [];

  if (pacote === "completo") {
    base = baseEstado[uf];
    linhas.push({item:"Estado Completo", desc:`Todos os municípios com dados de ${uf}`, valor:base, descnt:0});
  }
  else if (pacote === "sembp") {
    const bronzeCalculado = qtdBronze[uf] * precoBronzeCada;
    base = Math.max(bronzeCalculado, baseEstado[uf]);
    linhas.push({item:"Municípios Bronze", desc:`${qtdBronze[uf]} municípios × R$ 1,00`, valor:bronzeCalculado, descnt:0});
    if (base > bronzeCalculado) {
      linhas.push({item:"Ajuste mínimo estado", desc:`Preço mínimo garantido ${uf}`, valor:base, descnt:0, minimo:true});
    }
  }
  else if (pacote === "prata") {
    const fator = descontoPrata[qtdPrata] || 0.69;
    base = qtdPrata * precoPrata * fator;
    linhas.push({item:"Cidades Tier Prata", desc:`${qtdPrata} cidades`, valor:base.toFixed(0), descnt:qtdPrata>1?Math.round((1-fator)*100):0});
  }
  else if (pacote === "ouro") {
    const fator = descontoOuro[qtdOuro] || 0.80;
    base = qtdOuro * precoOuro * fator;
    linhas.push({item:"Cidades Tier Ouro", desc:`${qtdOuro} cidades`, valor:base.toFixed(0), descnt:qtdOuro>1?Math.round((1-fator)*100):0});
  }

  let multClasseResiduo = residuo || (classe==="I"?2.1:1);
  if (residuo) linhas.push({item:"Resíduo específico", desc:document.querySelector('#residuo option:checked').text.split('–')[0].trim(), valor:0, mult:residuo});
  else if (classe==="I") linhas.push({item:"Classe I (perigoso)", desc:"", valor:0, mult:2.1});
  if (tratamento>1) linhas.push({item:"Destino específico", desc:tratamento===1.7?"Coprocessamento":"Incineração", valor:0, mult:tratamento});
  linhas.push({item:"Atualização", desc:periodo===1?"Atual":periodo===1.5?"+6 meses":"+12 meses", valor:0, mult:periodo});

  const precoFinal = Math.round(base * multClasseResiduo * tratamento * periodo / 10) * 10;

  // === EXTRATO ===
  let tabela = `<div class="extrato"><h3>Extrato detalhado</h3><table class="extrato">
    <tr><th>Item</th><th>Descrição</th><th>Valor</th><th>Multiplicador / Desconto</th></tr>`;
  linhas.forEach(l => {
    const extra = l.mult ? `×${l.mult}` : (l.descnt>0 ? `−${l.descnt}%` : "");
    const valor = l.minimo ? `<span class="minimo">R$ ${l.valor}</span>` : `R$ ${l.valor||"-"}`;
    tabela += `<tr><td>${l.item}</td><td>${l.desc}</td><td>${valor}</td><td>${extra||"-"}</td></tr>`;
  });
  tabela += `<tr class="total"><td colspan="3"><strong>TOTAL A PAGAR</strong></td><td><strong>R$ ${precoFinal.toLocaleString('pt-BR')}</strong></td></tr></table></div>`;

  // === 5 EXEMPLOS 100% DINÂMICOS ===
  const dados = dadosExemplos[uf] || dadosExemplos.outros;
  const cidadesFiltradas = dados.filter(d => {
    if (pacote === "prata" && !d.prata) return false;
    if (pacote === "ouro" && !d.ouro) return false;
    if (pacote === "sembp") return !d.prata && !d.ouro;
    return true;
  });

  let exemplos = `<div class="exemplos"><h3>5 exemplos reais do seu relatório — ${uf}</h3>
    <table class="dados">
      <tr><th>Município</th><th>Volume anual (mil t)</th><th>${residuo?"Código":"Classe"}</th><th>${tratamento>1?"Destino principal":"Destinos"}</th></tr>`;

  cidadesFiltradas.slice(0,5).forEach(d => {
    const vol = d.volume ? `${d.volume[0]} – ${d.volume[1]}` : "Variável";
    const res = residuo ? d.residuo || "Vários" : (classe || "II/I");
    const dest = tratamento>1 ? d.destino || (tratamento===1.7?"Copro":"Incineração") : "Vários";
    exemplos += `<tr><td><strong>${d.cidade}</strong></td><td>${vol}</td><td>${res}</td><td>${dest}</td></tr>`;
  });
  exemplos += `</table><small>Dados 100% agregados • Nunca identifica empresa</small></div>`;

  document.getElementById("resultado").innerHTML = `<strong>R$ ${precoFinal.toLocaleString('pt-BR')}</strong>`;
  document.getElementById("extrato").innerHTML = tabela;
  document.getElementById("exemplos").innerHTML = exemplos;
}
</script>
</body>
</html>
